<!DOCTYPE html>
<html>
<head>

    if (!token) {

<title>City Driver PHONE FIX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<style>
  *{touch-action: manipulation;}
  body { margin:0; overflow:hidden; background:#000; font-family:Arial; }
  #gameContainer { position:relative; width:100vw; height:500px; background:#000; overflow:hidden; } /* FULL SCREEN */
  #menu { position:absolute; top:50px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:8px; } /* MOVED DOWN */
.mainBtn { padding:10px 14px; background:#FF6B00; border:none; color:#fff; font-weight:bold; border-radius:10px; font-size:13px; cursor:pointer; box-shadow:0 2px 5px #000; }
  #ghostBtn { background:#00FF88; }
  #hud { position:absolute; top:10px; left:10px; font-size:14px; color:#fff; background:rgba(0,0,0,0.8); padding:6px 10px; border-radius:8px; z-index:5; }
  #cityName { position:absolute; top:10px; right:10px; font-size:14px; color:#FFD700; font-weight:bold; text-shadow:0 0 3px #000; z-index:5; }
  #controls { position:absolute; bottom:25px; width:100%; display:flex; justify-content:center; gap:12px; z-index:5; } /* BIGGER GAP */
.pad { width:65px; height:65px; font-size:24px; background:rgba(34,34,34,0.9); color:#00E5FF; border:3px solid #00E5FF; border-radius:18px; cursor:pointer; user-select:none; box-shadow:0 0 10px #00E5FF; }
  #boost { background:rgba(0,255,136,0.9); color:#000; border-color:#00FF88; box-shadow:0 0 10px #00FF88; }
  #brake { background:rgba(255,59,48,0.9); color:#fff; border-color:#FF3B30; box-shadow:0 0 10px #FF3B30; }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="hud">Speed: 0 KM/H | Score: 0</div>
  <div id="cityName">CITY</div>
  
  <div id="menu">
    <button class="mainBtn" onclick="game.play()">PLAY</button>
    <button class="mainBtn" onclick="game.pause()">PAUSE</button>
    <button id="ghostBtn" class="mainBtn" onclick="game.toggleGhost()">GHOST: ON</button>
  </div>

  <div id="controls">
    <button class="pad" id="leftBtn">←</button>
    <button class="pad" id="upBtn">↑</button>
    <button class="pad" id="rightBtn">→</button>
    <button class="pad" id="brakeBtn">B</button>
    <button class="pad" id="boostBtn">N</button>
  </div>

  <canvas id="game"></canvas>
</div>
<script>
const game = {
  canvas: document.getElementById('game'),
  ctx: null,
  running: true,
  speed: 8,
  carX: 0, carY: 0,
  left: false, right: false, up: false, brake: false, boost: false,
  score: 0, city: 0, roadOffsetX: 0,
  traffic: [], buildings: [], 
  cities: ['CITY','DESERT','NIGHT'],
  SAFE_DISTANCE: 90,
  ghostMode: true,
  ROAD_WIDTH: 180,

  init() {
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    this.reset();
    this.setupButtons();
    this.loop();
    window.addEventListener('keydown', e=>{ 
      if(e.key=='ArrowLeft')this.left=true; 
      if(e.key=='ArrowRight')this.right=true; 
      if(e.key=='ArrowUp')this.up=true;
    });
    window.addEventListener('keyup', e=>{ 
      if(e.key=='ArrowLeft')this.left=false; 
      if(e.key=='ArrowRight')this.right=false; 
      if(e.key=='ArrowUp')this.up=false;
    });
  },

  toggleGhost(){
    this.ghostMode = !this.ghostMode;
    document.getElementById('ghostBtn').innerText = `GHOST: ${this.ghostMode?'ON':'OFF'}`;
    document.getElementById('ghostBtn').style.background = this.ghostMode?'#00FF88':'#FF3B30';
  },

  setupButtons(){
    const bind = (id, down, up) => {
      const el = document.getElementById(id);
      if(!el) return;
      ['mousedown','touchstart'].forEach(evt => el.addEventListener(evt, e=>{e.preventDefault(); down();}));
      ['mouseup','mouseleave','touchend','touchcancel'].forEach(evt => el.addEventListener(evt, e=>{e.preventDefault(); up();}));
    };
    bind('leftBtn', ()=>this.left=true, ()=>this.left=false);
    bind('rightBtn', ()=>this.right=true, ()=>this.right=false);
    bind('upBtn', ()=>this.up=true, ()=>this.up=false);
    bind('brakeBtn', ()=>this.brake=true, ()=>this.brake=false);
    bind('boostBtn', ()=>this.boost=true, ()=>this.boost=false);
  },

  resize(){
    this.canvas.width = window.innerWidth * window.devicePixelRatio;
    this.canvas.height = window.innerHeight * window.devicePixelRatio;
    this.ctx.setTransform(window.devicePixelRatio,0,0,window.devicePixelRatio,0,0);
    this.carX = window.innerWidth/2;
    this.carY = window.innerHeight - 130;
    this.roadPositions = [window.innerWidth/2-60, window.innerWidth/2, window.innerWidth/2+60];
  },

  reset() {
    this.speed=8; this.score=0; this.carX=window.innerWidth/2; this.carY=window.innerHeight-130; this.roadOffsetX=0;
    this.traffic=[]; this.buildings=[];

    for(let i=0;i<25;i++) this.buildings.push({
      x: Math.random()*window.innerWidth,
      y: -Math.random()*1500,
      w: 50+Math.random()*40,
      h: 100+Math.random()*120,
      floors: Math.floor(Math.random()*4)+2
    });

    // ONLY 4 CARS
    for(let lane=0; lane<3; lane++){
      for(let i=0;i<2;i++){
        if(lane==2 && i==1) continue;
        this.traffic.push({
          lane: lane,
          x: this.roadPositions[lane],
          y: -i*450 - 400,
          color: `hsl(${Math.random()*360},90%,55%)`,
          speed: 1.2 + Math.random()*1,
          targetLane: lane,
          avoiding: false
        });
      }
    }
    this.updateStats();
  },

  play(){ this.running=true; },
  pause(){ this.running=false; },

  updateStats(){ document.getElementById('hud').innerText = `Speed: ${Math.floor(this.speed*5)} KM/H | Score: ${this.score}`; },

  update(){
    if(!this.running) return;

    let moveSpeed = 6;
    if(this.left) { this.carX -= moveSpeed; this.roadOffsetX += 1.8; }
    if(this.right) { this.carX += moveSpeed; this.roadOffsetX -= 1.8; }
    if(this.up){ this.carY -= 6; this.speed += 0.4; }
    if(this.brake) { this.carY += 5; this.speed -= 1.2; }
    if(this.boost) this.speed += 1;
    
    if(!this.up && !this.boost && !this.brake) this.speed *= 0.985; 
    if(this.speed < 6) this.speed = 6;
    this.speed = Math.max(6, Math.min(this.speed, 35));

    this.carY = Math.max(80, Math.min(this.carY, window.innerHeight - 80));
    this.carX = Math.max(25, Math.min(this.carX, window.innerWidth-25));
    
    this.roadOffsetX *= 0.92; 
    
    if(Math.abs(this.roadOffsetX) > 100){
      this.city = (this.city + (this.roadOffsetX>0?2:1)) % 3;
      document.getElementById('cityName').innerText = this.cities[this.city];
      this.roadOffsetX *= 0.5;
    }

    this.buildings.forEach(b=>{ 
      b.y += this.speed; 
      if(b.y > window.innerHeight) b.y = -200;
    });

    this.traffic.forEach(t=>{
      t.avoiding = false;
      t.x = this.roadPositions[t.targetLane] + this.roadOffsetX;
      t.y += this.speed + t.speed;
      
      let dx = t.x - this.carX;
      let dy = t.y - this.carY;
      let dist = Math.hypot(dx, dy);

      if(this.ghostMode && dist < this.SAFE_DISTANCE && Math.abs(dy) < 130){
        if(dx > 0){ if(t.lane < 2) t.targetLane = t.lane + 1; }
        else { if(t.lane > 0) t.targetLane = t.lane - 1; }
        t.speed *= 0.9;
        t.avoiding = true;
      }

      if(t.y > window.innerHeight){
        t.y = -450 - Math.random()*200;
        t.lane = Math.floor(Math.random()*3);
        t.targetLane = t.lane;
        t.speed = 1.2 + Math.random()*1;
        this.score++;
      }

      if(!this.ghostMode && dist < 35) {
        this.running=false;
        setTimeout(()=>{ alert(`CRASH! Score: ${this.score}`); this.reset(); }, 200);
      }
    });

    this.updateStats();
  },

  drawCar(x,y,color,avoiding){
    this.ctx.fillStyle=color;
    this.roundRect(x-15, y-26, 30, 52, 5);
    this.ctx.fill();
    this.ctx.fillStyle='rgba(0,0,0,0.7)';
    this.ctx.fillRect(x-10, y-19, 20, 9);
    this.ctx.fillRect(x-10, y+8, 20, 9);
    this.ctx.fillStyle = avoiding? '#FF0000' : '#FFFFAA';
    this.ctx.fillRect(x-13, y-23, 5, 2);
    this.ctx.fillRect(x+8, y-23, 5, 2);
    this.ctx.fillStyle='#111';
    [[-10,-15], [10,-15], [-10,13], [10,13]].forEach(([ox,oy])=>{
      this.ctx.beginPath(); this.ctx.arc(x+ox, y+oy, 4, 0, Math.PI*2); this.ctx.fill();
    });
  },
  roundRect(x, y, w, h, r){
    this.ctx.beginPath();
    this.ctx.moveTo(x+r, y);
    this.ctx.lineTo(x+w-r, y);
    this.ctx.arcTo(x+w, y, x+w, y+r, r);
    this.ctx.lineTo(x+w, y+h-r);
    this.ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
    this.ctx.lineTo(x+r, y+h);
    this.ctx.arcTo(x, y+h, x, y+h-r, r);
    this.ctx.lineTo(x, y+r);
    this.ctx.arcTo(x, y, x+r, y, r);
    this.ctx.closePath();
  },

  draw(){
    const w = window.innerWidth;
    const h = window.innerHeight;
    let sky = this.ctx.createLinearGradient(0,0,0,h);
    if(this.city==0){ sky.addColorStop(0,'#87CEEB'); sky.addColorStop(1,'#E0F6FF'); }
    if(this.city==1){ sky.addColorStop(0,'#DEB887'); sky.addColorStop(1,'#F5DEB3'); }
    if(this.city==2){ sky.addColorStop(0,'#050515'); sky.addColorStop(1,'#1a1a3a'); }
    this.ctx.fillStyle=sky;
    this.ctx.fillRect(0,0,w,h);

    this.buildings.forEach(b=>{
      this.ctx.fillStyle=this.city==1?'#8B4513':(this.city==2?'#151515':'#333');
      this.ctx.fillRect(b.x, b.y, b.w, b.h);
      for(let i=0;i<b.floors;i++){
        this.ctx.fillStyle=this.city==2?'#FFD700':'#ADD8E6';
        this.ctx.fillRect(b.x+5, b.y+8+i*(b.h/b.floors), 6, 6);
        this.ctx.fillRect(b.x+b.w-11, b.y+8+i*(b.h/b.floors), 6, 6);
      }
    });

    let roadX = w/2 + this.roadOffsetX;
    this.ctx.fillStyle='#222';
    this.ctx.fillRect(roadX-this.ROAD_WIDTH/2, 0, this.ROAD_WIDTH, h);
    this.ctx.strokeStyle=this.city==2?'#FFFF00':'#FFFFFF'; 
    this.ctx.setLineDash([25,18]);
    this.roadPositions.forEach(rp=>{
      let x = rp + this.roadOffsetX;
      this.ctx.beginPath(); this.ctx.moveTo(x,0); this.ctx.lineTo(x,h); this.ctx.stroke();
    });
    this.ctx.setLineDash([]);

    this.traffic.forEach(t=>this.drawCar(t.x,t.y,t.color,t.avoiding));

    this.ctx.shadowColor='rgba(255,0,0,0.9)'; this.ctx.shadowBlur=25;
    this.drawCar(this.carX, this.carY, '#FF0000', false);
    this.ctx.shadowBlur=0;

    if(!this.running){
      this.ctx.fillStyle='rgba(0,0,0,0.8)'; this.ctx.fillRect(0,0,w,h);
      this.ctx.fillStyle='#fff'; this.ctx.font='bold 32px Arial'; this.ctx.textAlign='center'; 
      this.ctx.fillText('PAUSED', w/2, h/2);
    }
  },

  loop(){
    this.update();
    this.draw();
    requestAnimationFrame(()=>this.loop());
  }
};

window.onload = ()=>game.init();

window.onresize = ()=>game.resize();
</script>
</body>
</html>
