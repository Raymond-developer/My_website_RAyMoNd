<!DOCTYPE html>
<html>
<head>
<title>City Driver DOCTOR DRIVE SMALL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<style>
  *{touch-action: manipulation;}
  body { margin:0; overflow:hidden; background:#111; font-family:Arial; display:flex; justify-content:center; align-items:center; }
  #gameContainer { position:relative; width:100%; max-width:320px; height:100vh; background:#000; overflow:hidden; } /* SMALLER */
  #menu { position:absolute; top:6px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:4px; }
.mainBtn { padding:6px 10px; background:#FF6B00; border:none; color:#fff; font-weight:bold; border-radius:6px; font-size:10px; cursor:pointer; }
  #ghostBtn { background:#00FF88; }
  #hud { position:absolute; top:6px; left:6px; font-size:12px; color:#fff; background:rgba(0,0,0,0.7); padding:4px 8px; border-radius:6px; }
  #cityName { position:absolute; top:38px; left:50%; transform:translateX(-50%); font-size:14px; color:#FFD700; font-weight:bold; text-shadow:0 0 3px #000; }
  #controls { position:absolute; bottom:10px; width:100%; display:flex; justify-content:center; gap:10px; }
.pad { width:50px; height:50px; font-size:18px; background:#222; color:#00E5FF; border:2px solid #00E5FF; border-radius:12px; cursor:pointer; user-select:none; }
  #boost { background:#00FF88; color:#000; border-color:#00FF88; }
  #brake { background:#FF3B30; color:#fff; border-color:#FF3B30; }
  canvas { display:block; margin:0 auto; }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="menu">
    <button class="mainBtn" onclick="game.play()">PLAY</button>
    <button class="mainBtn" onclick="game.pause()">PAUSE</button>
    <button id="ghostBtn" class="mainBtn" onclick="game.toggleGhost()">GHOST: ON</button>
  </div>
  <div id="hud">Speed: 0 KM/H</div>
  <div id="cityName">CITY</div>

  <div id="controls">
    <button class="pad" id="leftBtn">←</button>
    <button class="pad" id="upBtn">↑</button>
    <button class="pad" id="rightBtn">→</button>
    <button class="pad" id="brakeBtn">B</button>
    <button class="pad" id="boostBtn">N</button>
  </div>

  <canvas id="game"></canvas>
</div>
<script>
const game = {
  canvas: document.getElementById('game'),
  ctx: null,
  running: true,
  speed: 6, // SLOWER START
  carX: 0, carY: 0,
  left: false, right: false, up: false, brake: false, boost: false,
  score: 0, city: 0, roadOffsetX: 0,
  traffic: [], buildings: [], 
  stats: JSON.parse(localStorage.getItem('cityStatsSMALL')) || {high:0, played:0, lost:0},
  cities: ['CITY','DESERT','NIGHT'],
  SAFE_DISTANCE: 80, // SMALLER BUBBLE
  ghostMode: true,
  ROAD_WIDTH: 160, // NARROWER ROAD

  init() {
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    this.reset();
    this.setupButtons();
    this.loop();
    window.addEventListener('keydown', e=>{ 
      if(e.key=='ArrowLeft')this.left=true; 
      if(e.key=='ArrowRight')this.right=true; 
      if(e.key=='ArrowUp')this.up=true;
    });
    window.addEventListener('keyup', e=>{ 
      if(e.key=='ArrowLeft')this.left=false; 
      if(e.key=='ArrowRight')this.right=false; 
      if(e.key=='ArrowUp')this.up=false;
    });
  },

  toggleGhost(){
    this.ghostMode = !this.ghostMode;
    document.getElementById('ghostBtn').innerText = `GHOST: ${this.ghostMode?'ON':'OFF'}`;
    document.getElementById('ghostBtn').style.background = this.ghostMode?'#00FF88':'#FF3B30';
  },

  setupButtons(){
    const bind = (id, down, up) => {
      const el = document.getElementById(id);
      if(!el) return;
      ['mousedown','touchstart'].forEach(evt => el.addEventListener(evt, e=>{e.preventDefault(); down();}));
      ['mouseup','mouseleave','touchend','touchcancel'].forEach(evt => el.addEventListener(evt, e=>{e.preventDefault(); up();}));
    };
    bind('leftBtn', ()=>this.left=true, ()=>this.left=false);
    bind('rightBtn', ()=>this.right=true, ()=>this.right=false);
    bind('upBtn', ()=>this.up=true, ()=>this.up=false);
    bind('brakeBtn', ()=>this.brake=true, ()=>this.brake=false);
    bind('boostBtn', ()=>this.boost=true, ()=>this.boost=false);
  },

  resize(){
    this.canvas.width = 320; // SMALL WIDTH
    this.canvas.height = window.innerHeight;
    this.carX = this.canvas.width/2;
    this.carY = this.canvas.height - 100; // CAR HIGHER
    this.roadPositions = [this.canvas.width/2-50, this.canvas.width/2, this.canvas.width/2+50]; // LANES CLOSER
  },

  reset() {
    this.speed=6; this.score=0; this.carX=this.canvas.width/2; this.carY=this.canvas.height-100; this.roadOffsetX=0;
    this.traffic=[]; this.buildings=[];
    document.getElementById('cityName').innerText = this.cities[this.city];

    for(let i=0;i<30;i++) this.buildings.push({ // FEWER BUILDINGS
      x: Math.random()*this.canvas.width,
      y: -Math.random()*1500,
      w: 50+Math.random()*40,
      h: 100+Math.random()*120,
      floors: Math.floor(Math.random()*4)+2
    });

    // ONLY 4 CARS TOTAL. VERY SLOW
    for(let lane=0; lane<3; lane++){
      for(let i=0;i<2;i++){
        if(lane==2 && i==1) continue; // SKIP 1 CAR = TOTAL 5 CARS
        this.traffic.push({
          lane: lane,
          x: this.roadPositions[lane] + this.roadOffsetX,
          y: -i*500 - 400, // MORE SPACE
          color: `hsl(${Math.random()*360},90%,55%)`,
          speed: 1 + Math.random()*1, // VERY SLOW TRAFFIC
          targetLane: lane,
          avoiding: false
        });
      }
    }
    this.updateStats();
  },

  play(){ this.running=true; this.stats.played++; this.save(); },
  pause(){ this.running=false; },

  save(){ localStorage.setItem('cityStatsSMALL', JSON.stringify(this.stats)); },
  updateStats(){ document.getElementById('hud').innerText = `Speed: ${Math.floor(this.speed*5)} KM/H | Score: ${this.score}`; },

  update(){
    if(!this.running) return;

    let moveSpeed = 5; // SLOWER TURNING
    if(this.left) { this.carX -= moveSpeed; this.roadOffsetX += 1.5; }
    if(this.right) { this.carX += moveSpeed; this.roadOffsetX -= 1.5; }
    if(this.up){ this.carY -= 5; this.speed += 0.3; } // SLOWER UP
    if(this.brake) { this.carY += 4; this.speed -= 1; }
    if(this.boost) this.speed += 0.8;
    
    if(!this.up && !this.boost && !this.brake) this.speed *= 0.985; 
    if(this.speed < 5) this.speed = 5; // MIN SPEED LOWER
    this.speed = Math.max(5, Math.min(this.speed, 30)); // MAX SPEED LOWER

    this.carY = Math.max(70, Math.min(this.carY, this.canvas.height - 70));
    this.carX = Math.max(25, Math.min(this.carX, this.canvas.width-25));
    
    this.roadOffsetX *= 0.93; 
    
    if(Math.abs(this.roadOffsetX) > 90){
      this.city = (this.city + (this.roadOffsetX>0?2:1)) % 3;
      document.getElementById('cityName').innerText = `ENTERING ${this.cities[this.city]}`;
      this.roadOffsetX *= 0.5;
    }

    this.buildings.forEach(b=>{ 
      b.y += this.speed; 
      if(b.y > this.canvas.height) b.y = -200;
    });

    this.traffic.forEach(t=>{
      t.avoiding = false;
      t.x = this.roadPositions[t.targetLane] + this.roadOffsetX;
      t.y += this.speed + t.speed;
      
      let dx = t.x - this.carX;
      let dy = t.y - this.carY;
      let dist = Math.hypot(dx, dy);

      if(this.ghostMode){
        if(Math.abs(dx) < this.SAFE_DISTANCE && Math.abs(dy) < 120){
          if(dx > 0){ if(t.lane < 2) t.targetLane = t.lane + 1; }
          else { if(t.lane > 0) t.targetLane = t.lane - 1; }
          t.speed *= 0.9;
          t.avoiding = true;
        }
        if(dist < this.SAFE_DISTANCE) {
          t.speed = Math.min(t.speed, 0.8);
          t.avoiding = true;
        }
      }

      if(t.y > this.canvas.height){
        t.y = -500 - Math.random()*200;
        t.lane = Math.floor(Math.random()*3);
        t.targetLane = t.lane;
        t.speed = 1 + Math.random()*1;
        this.score++;
      }

      if(!this.ghostMode && dist < 35) this.crash();
    });

    this.updateStats();
  },

  crash(){
    this.running=false;
    this.stats.lost++;
    if(this.score>this.stats.high) this.stats.high=this.score;
    this.save();
    setTimeout(()=>{ alert(`CRASH! Score: ${this.score}\nHigh Score: ${this.stats.high}`); this.reset(); }, 200);
  },

  roundRect(x, y, w, h, r){
    this.ctx.beginPath();
    this.ctx.moveTo(x+r, y);
    this.ctx.lineTo(x+w-r, y);
    this.ctx.arcTo(x+w, y, x+w, y+r, r);
    this.ctx.lineTo(x+w, y+h-r);
    this.ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
    this.ctx.lineTo(x+r, y+h);
    this.ctx.arcTo(x, y+h, x, y+h-r, r);
    this.ctx.lineTo(x, y+r);
    this.ctx.arcTo(x, y, x+r, y, r);
    this.ctx.closePath();
  },

  drawCar(x,y,color,avoiding){
    this.ctx.fillStyle=color;
    this.roundRect(x-14, y-24, 28, 48, 4); // SMALLER CAR
    this.ctx.fill();
    this.ctx.fillStyle='rgba(0,0,0,0.7)';
    this.ctx.fillRect(x-9, y-18, 18, 8);
    this.ctx.fillRect(x-9, y+8, 18, 8);
    this.ctx.fillStyle = avoiding? '#FF0000' : '#FFFFAA';
    this.ctx.fillRect(x-12, y-22, 5, 2);
    this.ctx.fillRect(x+7, y-22, 5, 2);
    this.ctx.fillStyle='#111';
    [[-9,-14], [9,-14], [-9,12], [9,12]].forEach(([ox,oy])=>{
      this.ctx.beginPath(); this.ctx.arc(x+ox, y+oy, 3.5, 0, Math.PI*2); this.ctx.fill();
    });
  },

  draw(){
    let sky = this.ctx.createLinearGradient(0,0,0,this.canvas.height);
    if(this.city==0){ sky.addColorStop(0,'#87CEEB'); sky.addColorStop(1,'#E0F6FF'); }
    if(this.city==1){ sky.addColorStop(0,'#DEB887'); sky.addColorStop(1,'#F5DEB3'); }
    if(this.city==2){ sky.addColorStop(0,'#050515'); sky.addColorStop(1,'#1a1a3a'); }
    this.ctx.fillStyle=sky;
    this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height);

    this.buildings.forEach(b=>{
      this.ctx.fillStyle=this.city==1?'#8B4513':(this.city==2?'#151515':'#333');
      this.ctx.fillRect(b.x, b.y, b.w, b.h);
      for(let i=0;i<b.floors;i++){
        this.ctx.fillStyle=this.city==2?'#FFD700':'#ADD8E6';
        this.ctx.fillRect(b.x+5, b.y+8+i*(b.h/b.floors), 6, 6);
        this.ctx.fillRect(b.x+b.w-11, b.y+8+i*(b.h/b.floors), 6, 6);
      }
    });

    let roadX = this.canvas.width/2 + this.roadOffsetX;
    this.ctx.fillStyle='#444';
    this.ctx.fillRect(roadX-this.ROAD_WIDTH/2, 0, this.ROAD_WIDTH, this.canvas.height);
    this.ctx.fillStyle='#222';
    this.ctx.fillRect(roadX-this.ROAD_WIDTH/2+6, 0, this.ROAD_WIDTH-12, this.canvas.height);
    
    this.ctx.strokeStyle=this.city==2?'#FFFF00':'#FFFFFF'; 
    this.ctx.setLineDash([20,15]); // SMALLER DASHES
    this.roadPositions.forEach(rp=>{
      let x = rp + this.roadOffsetX;
      this.ctx.beginPath(); this.ctx.moveTo(x,0); this.ctx.lineTo(x,this.canvas.height); this.ctx.stroke();
    });
    this.ctx.setLineDash([]);

    this.traffic.forEach(t=>this.drawCar(t.x,t.y,t.color,t.avoiding));

    this.ctx.shadowColor='rgba(255,0,0,0.8)'; this.ctx.shadowBlur=15;
    this.drawCar(this.carX, this.carY, '#FF0000', false);
    this.ctx.shadowBlur=0;

    if(!this.running){
      this.ctx.fillStyle='rgba(0,0,0,0.8)'; this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
      this.ctx.fillStyle='#fff'; this.ctx.font='24px Arial Black'; this.ctx.fillText('PAUSED', this.canvas.width/2-45, this.canvas.height/2);
    }
  },

  loop(){
    this.update();
    this.draw();
    requestAnimationFrame(()=>this.loop());
  }
};

window.onload = ()=>game.init();
window.onresize = ()=>game.resize();
</script>
</body>
</html>
