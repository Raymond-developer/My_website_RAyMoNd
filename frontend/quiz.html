<!DOCTYPE html>
<html lang="en">
<head>

  <script>
  const token = localStorage.getItem('token');

    if (!token) {
      // Not logged in? Kick out immediately
      window.location.replace('/login.html');
    } 
   </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> QUIZ </title>
<style>
 /* === MOBILE: 320px+ === */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background-image: url('photo_2026-07-24_19-55-32.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  font-family: Roboto, Arial, sans-serif;
  padding: 20px 4%;
  min-height: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

html, body {
  height: 100%;
}

.top-div {
  margin-top: 20px;
  width: 100%;
  max-width: 555px;
  margin-left: 0;
  height: auto;
  min-height: 500px;
  border: 3px solid gray;
  border-radius: 7px;
  background-color: white;
  padding: 20px 4%;
}

.simple {
  margin-left: 0;
  padding-bottom: 20px;
  border-bottom: 2px solid gray;
  margin-bottom: 20px;
}

.question {
  margin-left: 0;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 20px;
  margin-top: 0;
  line-height: 130%;
}

.btn {
  display: block;
  margin-left: 0;
  padding: 12px 5%;
  width: 100%;
  margin-bottom: 15px;
  border-radius: 7px;
  border: 3px solid gray;
  font-size: 16px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  background-color: #fff;
}

.btn:hover:not([disabled]) {
  background: rgb(44, 43, 43);
  color: rgb(245, 241, 241);
}

.btn:disabled {
  cursor: no-drop;
}

.next-btn {
  margin-top: 10px;
  margin-left: 0;
  font-size: 18px;
  font-weight: 600;
  background-color: rgb(14, 14, 197);
  color: white;
  width: 100%;
  padding: 12px 5%;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  display: none;
}

.next-btn:hover {
  background: rgb(7, 7, 7);
  color: rgb(245, 241, 241);
}

.correct {
  background-color: rgb(20, 230, 20);
  color: #fff;
  border-color: rgb(20, 230, 20);
}

.incorrect {
  background-color: rgb(238, 19, 19);
  color: #fff;
  border-color: rgb(238, 19, 19);
}

/* === TABLET: 600px+ === */
@media (min-width: 600px) {
  body {
    padding: 30px 5%;
    align-items: center;
  }

 .top-div {
    margin-top: 0;
    padding: 25px 5%;
    min-height: 550px;
  }

 .question {
    font-size: 22px;
    margin-bottom: 25px;
  }

 .btn {
    font-size: 18px;
    padding: 14px 4%;
    margin-bottom: 20px;
  }

 .next-btn {
    font-size: 20px;
    width: 150px;
    margin-left: auto;
    margin-right: auto;
    display: none;
  }

 .simple {
    padding-bottom: 25px;
  }
}

/* === DESKTOP: 1024px+ === */
@media (min-width: 1024px) {
 .top-div {
    min-height: 600px;
  }

 .question {
    font-size: 25px;
  }

 .btn {
    font-size: 20px;
  }

 .next-btn {
    font-size: 22px;
    width: 120px;
    margin-left: 200px;
    margin-right: 0;
  }
}
</style>
</head>
<body>
  <div class="top-div">
     <h1 class="simple"> Simple Quiz </h1>
     <div class="question"> question goes here</div>
     <div class="btnn">
      <button class="btn">answer 1</button>
      <button class="btn">answer 2</button>
      <button class="btn">answer 3</button>
      <button class="btn">answer 4</button>
     </div>
     <button class="next-btn">Next</button>
  </div>

  <script>
     const questions = [
  {
    question: "Which country is known as the Land of the Rising Sun?",
    answers: [
      { text: "China", correct: false },
      { text: "Japan", correct: true },
      { text: "South Korea", correct: false },
      { text: "Thailand", correct: false }
    ]
  },
  {
    question: "How many continents are there in the world?",
    answers: [
      { text: "5", correct: false },
      { text: "6", correct: false },
      { text: "7", correct: true },
      { text: "8", correct: false }
    ]
  },
  {
    question: "What is the largest ocean on Earth?",
    answers: [
      { text: "Atlantic Ocean", correct: false },
      { text: "Indian Ocean", correct: false },
      { text: "Arctic Ocean", correct: false },
      { text: "Pacific Ocean", correct: true }
    ]
  },
  {
    question: "Which animal is called the King of the Jungle?",
    answers: [
      { text: "Tiger", correct: false },
      { text: "Elephant", correct: false },
      { text: "Lion", correct: true },
      { text: "Bear", correct: false }
    ]
  },
  {
    question: "What color do you get when you mix red and blue?",
    answers: [
      { text: "Green", correct: false },
      { text: "Purple", correct: true },
      { text: "Orange", correct: false },
      { text: "Brown", correct: false }
    ]
  },
  {
    question: "Which is the longest river in the world?",
    answers: [
      { text: "Amazon River", correct: false },
      { text: "Nile River", correct: true },
      { text: "Mississippi River", correct: false },
      { text: "Yangtze River", correct: false }
    ]
  },
  {
    question: "How many days are there in a leap year?",
    answers: [
      { text: "365", correct: false },
      { text: "366", correct: true },
      { text: "364", correct: false },
      { text: "367", correct: false }
    ]
  },
  {
    question: "Which sport is played at Wimbledon?",
    answers: [
      { text: "Cricket", correct: false },
      { text: "Football", correct: false },
      { text: "Tennis", correct: true },
      { text: "Golf", correct: false }
    ]
  },
  {
    question: "What is the capital of Nigeria?",
    answers: [
      { text: "Lagos", correct: false },
      { text: "Kano", correct: false },
      { text: "Abuja", correct: true },
      { text: "Port Harcourt", correct: false }
    ]
  },
  {
    question: "Which planet is closest to the Sun?",
    answers: [
      { text: "Venus", correct: false },
      { text: "Earth", correct: false },
      { text: "Mercury", correct: true },
      { text: "Mars", correct: false }
    ]
  },
  {
    question: "How many sides does a triangle have?",
    answers: [
      { text: "2", correct: false },
      { text: "3", correct: true },
      { text: "4", correct: false },
      { text: "5", correct: false }
    ]
  },
  {
    question: "Which fruit is yellow and monkeys love it?",
    answers: [
      { text: "Apple", correct: false },
      { text: "Banana", correct: true },
      { text: "Orange", correct: false },
      { text: "Grapes", correct: false }
    ]
  },
  {
    question: "What do we use to measure temperature?",
    answers: [
      { text: "Ruler", correct: false },
      { text: "Thermometer", correct: true },
      { text: "Scale", correct: false },
      { text: "Clock", correct: false }
    ]
  },
  {
    question: "Which is the fastest land animal?",
    answers: [
      { text: "Lion", correct: false },
      { text: "Cheetah", correct: true },
      { text: "Horse", correct: false },
      { text: "Leopard", correct: false }
    ]
  },
  {
    question: "How many wheels does a bicycle have?",
    answers: [
      { text: "1", correct: false },
      { text: "2", correct: true },
      { text: "3", correct: false },
      { text: "4", correct: false }
    ]
  }
];

  const questiomElement = document.querySelector('.question')
  const answerButtons = document.querySelector('.btnn') 
  const nextButton = document.querySelector('.next-btn')   
  
  let currentQuestionIndex = 0;
  let score = 0;
  

  
  function startQuiz() {
    let currentQuestionIndex = 0;
    let score = 0;
    nextButton.innerHTML = 'Next';
    showQuestion();
  }

  function showQuestion() {
   resetState();

    let currentQuestion = questions[currentQuestionIndex]
    let questionNo = currentQuestionIndex + 1;
    questiomElement.innerHTML = questionNo + ". " + currentQuestion.question;

    currentQuestion.answers.forEach((answer) => {
      const button = document.createElement("button")
      button.innerHTML = answer.text
      button.classList.add("btn")
      answerButtons.appendChild(button)
      if(answer.correct) {
         button.dataset.correct = answer.correct;
      }

      button.addEventListener('click', (button) => {
        const selecteBtn = button.target;
        const isCorrect = selecteBtn.dataset.correct === "true";
         if(isCorrect) {
           selecteBtn.classList.add("correct")
           score++;
         }else {
           selecteBtn.classList.add("incorrect")
         }

         Array.from(answerButtons.children).forEach((button) => {
          if(button.dataset.correct === "true"){
            button.classList.add("correct")
          }
         button.disabled = true;

         })

         nextButton.style.display = "block";
      })

    })
  };

 function resetState() {
    nextButton.style.display = "none";
    while(answerButtons.firstChild) {
      answerButtons.removeChild(answerButtons.firstChild)
    }
  } 
    


  nextButton.addEventListener("click", () => {
     if(currentQuestionIndex < questions.length) {

    currentQuestionIndex++;
    if(currentQuestionIndex < questions.length) {
      showQuestion()
   } else {
      showScore()
    }
   }else {
    startQuiz()
   } 
})

   function showScore() {
    resetState()
    questiomElement.innerHTML = `You score ${score} out of ${questions.length}`
    nextButton.innerHTML = "play again "
    nextButton.style.display = 'block'
  } 

 
  startQuiz();
  </script>
</body>
</html>
