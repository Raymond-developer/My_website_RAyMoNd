<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> QUIZ </title>
<style>
 
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background-image: url('photo_2026-07-24_20-36-26.jpg');
   background-size: cover;
  background-position: center;
  
  font-family: Roboto, Arial, sans-serif;
  padding: 20px 4%;
  min-height: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

html, body {
  height: 100%;
}

.top-div {
  margin-top: 20px;
  width: 100%;
  max-width: 555px;
  margin-left: 0;
  height: auto;
  min-height: 500px;
  border: 3px solid gray;
  border-radius: 7px;
  background-color: white;
  padding: 20px 4%;
}

.simple {
  margin-left: 0;
  padding-bottom: 20px;
  border-bottom: 2px solid gray;
  margin-bottom: 20px;
}

.question {
  margin-left: 0;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 20px;
  margin-top: 0;
  line-height: 130%;
}

.btn {
  display: block;
  margin-left: 0;
  padding: 12px 5%;
  width: 100%;
  margin-bottom: 15px;
  border-radius: 7px;
  border: 3px solid gray;
  font-size: 16px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  background-color: #fff;
}

.btn:hover:not([disabled]) {
  background: rgb(44, 43, 43);
  color: rgb(245, 241, 241);
}

.btn:disabled {
  cursor: no-drop;
}

.next-btn {
  margin-top: 10px;
  margin-left: 0;
  font-size: 18px;
  font-weight: 600;
  background-color: rgb(14, 14, 197);
  color: white;
  width: 100%;
  padding: 12px 5%;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  display: none;
}

.next-btn:hover {
  background: rgb(7, 7, 7);
  color: rgb(245, 241, 241);
}

.correct {
  background-color: rgb(20, 230, 20);
  color: #fff;
  border-color: rgb(20, 230, 20);
}

.incorrect {
  background-color: rgb(238, 19, 19);
  color: #fff;
  border-color: rgb(238, 19, 19);
}

/* === TABLET: 600px+ === */
@media (min-width: 600px) {
  body {
    padding: 30px 5%;
    align-items: center;
  }

 .top-div {
    margin-top: 0;
    padding: 25px 5%;
    min-height: 550px;
  }

 .question {
    font-size: 22px;
    margin-bottom: 25px;
  }

 .btn {
    font-size: 18px;
    padding: 14px 4%;
    margin-bottom: 20px;
  }

 .next-btn {
    font-size: 20px;
    width: 150px;
    margin-left: auto;
    margin-right: auto;
    display: none;
  }

 .simple {
    padding-bottom: 25px;
  }
}

/* === DESKTOP: 1024px+ === */
@media (min-width: 1024px) {
 .top-div {
    min-height: 600px;
  }

 .question {
    font-size: 25px;
  }

 .btn {
    font-size: 20px;
  }

 .next-btn {
    font-size: 22px;
    width: 120px;
    margin-left: 200px;
    margin-right: 0;
  }
}
</style>
</head>
<body>
  <div class="top-div">
     <h1 class="simple"> Simple Quiz </h1>
     <div class="question"> question goes here</div>
     <div class="btnn">
      <button class="btn">answer 1</button>
      <button class="btn">answer 2</button>
      <button class="btn">answer 3</button>
      <button class="btn">answer 4</button>
     </div>
     <button class="next-btn">Next</button>
  </div>

  <script>
  const questions = [
  {
    question: "Which sport is known as 'The King of Sports'?",

      { text: "Basketball", correct: false },

  },
  {

      { text: "Application Programming Interface", correct: true },
      { text: "Advanced Program Integration", correct: false },
      { text: "Application Process Input", correct: false },
      { text: "Automated Programming Interface", correct: false }
    ]
  },
  {
    question: "Who was the first person to walk on the moon?",
    answers: [
      { text: "Buzz Aldrin", correct: false },
      { text: "Neil Armstrong", correct: true },
      { text: "Yuri Gagarin", correct: false },

    ]
  },
  {

    ]
  },
  {
    question: "What is the longest river in the world?",
    answers: [
      { text: "Amazon River", correct: false },
      { text: "Nile River", correct: true },

      { text: "Yangtze River", correct: false }
    ]
  },
  {
    question: "Which company created the Android operating system?",
    answers: [
      { text: "Apple", correct: false },
      { text: "Microsoft", correct: false },
      { text: "Google", correct: true },
      { text: "Samsung", correct: false }
    ]
  },
  {
    question: "How many players are on a basketball team on court?",
    answers: [
      { text: "4", correct: false },
      { text: "5", correct: true },
      { text: "6", correct: false },
      { text: "7", correct: false }
    ]
  },
  {
    question: "What does 'VPN' stand for?",
    answers: [
      { text: "Virtual Private Network", correct: true },
      { text: "Very Personal Network", correct: false },
      { text: "Visual Private Net", correct: false },
      { text: "Virtual Public Node", correct: false }
    ]
  },
  {
    question: "Which country won the most Olympic gold medals all time?",
    answers: [
      { text: "China", correct: false },
      { text: "Russia", correct: false },
      { text: "USA", correct: true },
      { text: "Germany", correct: false }
    ]
  },
  {
    question: "What is the process of plants making food called?",
    answers: [
      { text: "Respiration", correct: false },
      { text: "Photosynthesis", correct: true },
      { text: "Transpiration", correct: false },
      { text: "Digestion", correct: false }
    ]
  },
  {
    question: "Which of these is NOT a database?",
    answers: [
      { text: "Firebase", correct: false },
      { text: "MongoDB", correct: false },
      { text: "GitHub", correct: true },

    ]
  },
  {
    question: "In what year was Facebook launched?",
    answers: [

  },

  {

  },
  {

    ]
  },
  {
    question: "Who is known as the 'Father of Computers'?",
    answers: [
      { text: "Alan Turing", correct: false },
      { text: "Charles Babbage", correct: true },

      { text: "Steve Wozniak", correct: false }
    ]
  },
  {
    question: "Which game has characters like Mario and Luigi?",
    answers: [
      { text: "Sonic", correct: false },

    ]
  },
  {
    question: "What is the boiling point of water in Celsius?",
    answers: [
      { text: "90°C", correct: false },
      { text: "100°C", correct: true },
      { text: "110°C", correct: false },
      { text: "120°C", correct: false }
    ]
  },
  {
    question: "Which loop runs at least once in JavaScript?",
    answers: [
      { text: "for loop", correct: false },
      { text: "while loop", correct: false },
      { text: "do...while loop", correct: true },
      { text: "if loop", correct: false }
    ]
  },
  {
    question: "What is the national animal of Nigeria?",
    answers: [
      { text: "Lion", correct: false },
      { text: "Eagle", correct: true },
      { text: "Elephant", correct: false },
      { text: "Leopard", correct: false }
    ]
  }
];

  const questiomElement = document.querySelector('.question')
  const answerButtons = document.querySelector('.btnn') 
  const nextButton = document.querySelector('.next-btn')   
  
  let currentQuestionIndex = 0;
  let score = 0;
  

  
  function startQuiz() {
    let currentQuestionIndex = 0;
    let score = 0;
    nextButton.innerHTML = 'Next';
    showQuestion();
  }

  function showQuestion() {
   resetState();

    let currentQuestion = questions[currentQuestionIndex]
    let questionNo = currentQuestionIndex + 1;
    questiomElement.innerHTML = questionNo + ". " + currentQuestion.question;

    currentQuestion.answers.forEach((answer) => {
      const button = document.createElement("button")
      button.innerHTML = answer.text
      button.classList.add("btn")
      answerButtons.appendChild(button)
      if(answer.correct) {
         button.dataset.correct = answer.correct;
      }

      button.addEventListener('click', (button) => {
        const selecteBtn = button.target;
        const isCorrect = selecteBtn.dataset.correct === "true";
         if(isCorrect) {
           selecteBtn.classList.add("correct")
           score++;
         }else {
           selecteBtn.classList.add("incorrect")
         }

         Array.from(answerButtons.children).forEach((button) => {
          if(button.dataset.correct === "true"){
            button.classList.add("correct")
          }
         button.disabled = true;

         })

         nextButton.style.display = "block";
      })

    })
  };

 function resetState() {
    nextButton.style.display = "none";
    while(answerButtons.firstChild) {
      answerButtons.removeChild(answerButtons.firstChild)
    }
  } 
    


  nextButton.addEventListener("click", () => {
     if(currentQuestionIndex < questions.length) {

    currentQuestionIndex++;
    if(currentQuestionIndex < questions.length) {
      showQuestion()
   } else {
      showScore()
    }
   }else {
    startQuiz()
   } 
})

   function showScore() {
    resetState()
    questiomElement.innerHTML = `You score ${score} out of ${questions.length}`
    nextButton.innerHTML = "play again "
    nextButton.style.display = 'block'
  } 

 
  startQuiz();
  </script>
</body>
</html>
