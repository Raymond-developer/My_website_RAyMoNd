<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Media Vault</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #0f172a; color: #e2e8f0; padding: 15px; }
  .container { max-width: 1200px; margin: 0 auto; }
  
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 1.8rem; color: #38bdf8; }
  .user-id { font-size: 0.7rem; color: #94a3b8; }
  
  .upload-box { 
    background: #1e293b; padding: 20px; border-radius: 12px; 
    border: 2px dashed #334155; text-align: center; margin-bottom: 20px;
  }
  .upload-box input[type="file"] { 
    color: #e2e8f0; margin: 10px 0; width: 100%; max-width: 400px;
  }
  .btn {
    background: #38bdf8; color: #0f172a; border: none; padding: 12px 20px;
    border-radius: 8px; cursor: pointer; font-weight: 600; margin: 5px;
    transition: 0.2s; font-size: 1rem;
  }
  .btn:hover { background: #0ea5e9; transform: translateY(-2px); }
  .btn-danger { background: #f87171; color: white; }
  .btn-danger:hover { background: #ef4444; }
  .btn-clear { background: #fbbf24; color: #0f172a; }
  .btn-clear:hover { background: #f59e0b; }
  
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  
  .gallery { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
    gap: 15px; 
  }
  .card {
    background: #1e293b; border-radius: 12px; overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: relative;
    cursor: pointer;
  }
  .card img, .card video { width: 100%; height: 180px; object-fit: cover; display: block; background: #000; }
  .card-info { padding: 10px; font-size: 0.85rem; pointer-events: none; }
  .card-info p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .delete-btn {
    position: absolute; top: 8px; right: 8px; z-index: 10;
    background: rgba(239,68,68,0.95); border: none; color: white;
    border-radius: 50%; width: 32px; height: 32px; cursor: pointer;
    font-weight: bold; font-size: 18px; line-height: 32px;
  }
  
  .modal { 
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100;
  }
  .modal-content {
    background: #1e293b; padding: 25px; border-radius: 12px; text-align: center;
    max-width: 350px; width: 90%;
  }

  #viewerModal { background: rgba(0,0,0,0.95); padding: 0; }
  .viewer-content {
    position: relative; width: 100%; height: 100%; display: flex;
    justify-content: center; align-items: center;
  }
  .viewer-content img, .viewer-content video {
    max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px;
  }
  .close-viewer {
    position: absolute; top: 20px; right: 30px; font-size: 40px; color: white;
    cursor: pointer; font-weight: bold; z-index: 101;
  }
  
  .loader { text-align: center; padding: 40px; color: #94a3b8; grid-column: 1 / -1; }
  #uploadStatus { margin-top: 10px; min-height: 20px; }
  
  @media (max-width: 768px) {
    header { flex-direction: column; align-items: flex-start; }
    header h1 { font-size: 1.5rem; }
    .gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .card img, .card video { height: 140px; }
    .btn { padding: 10px 16px; font-size: 0.9rem; width: 100%; }
    .actions { width: 100%; }
    .close-viewer { top: 10px; right: 15px; font-size: 35px; }
  }
  @media (max-width: 480px) {
    body { padding: 10px; }
    .gallery { grid-template-columns: repeat(2, 1fr); }
    .card img, .card video { height: 120px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>📂 My Media Vault</h1>
      <p class="user-id" id="userIdDisplay"></p>
    </div>
    <div class="actions">
      <button class="btn btn-clear" onclick="clearAll()">Clear All My Files</button>
    </div>
  </header>

  <div class="upload-box">
    <form id="uploadForm">
      <input type="file" id="fileInput" name="files" multiple accept="image/*,video/*">
      <br>
      <button type="submit" class="btn">Upload Selected Files</button>
    </form>
    <p id="uploadStatus"></p>
  </div>

  <div id="gallery" class="gallery">
    <div class="loader">Loading your files...</div>
  </div>
</div>

<!-- Confirm Delete Modal -->
<div id="confirmModal" class="modal">
  <div class="modal-content">
    <h3 style="margin-bottom: 10px;">Delete this file?</h3>
    <p style="color: #94a3b8; margin-bottom: 20px;">This cannot be undone.</p>
    <button class="btn btn-danger" id="confirmDeleteBtn">Yes, Delete</button>
    <button class="btn" onclick="closeModal()">Cancel</button>
  </div>
</div>

<!-- Fullscreen Viewer Modal -->
<div id="viewerModal" class="modal" onclick="closeViewer()">
  <span class="close-viewer" onclick="closeViewer()">×</span>
  <div class="viewer-content" id="viewerContent" onclick="event.stopPropagation()"></div>
</div>

<script>
const BACKEND_URL = "https://my-website-r-ay-mo-nd.vercel.app"; // <-- IMPORTANT: CHANGE THIS TO YOUR VERCEL BACKEND URL

// 1. CREATE A UNIQUE USER ID FOR THIS DEVICE
let userId = localStorage.getItem('mediaVaultUserId');
if(!userId){
  userId = 'user_' + Math.random().toString(36).substr(2, 9);
  localStorage.setItem('mediaVaultUserId', userId);
}
document.getElementById('userIdDisplay').innerText = `Device ID: ${userId}`; // so you know it's private

const gallery = document.getElementById('gallery');
const uploadForm = document.getElementById('uploadForm');
const uploadStatus = document.getElementById('uploadStatus');
let deleteId = null;

// 2. LOAD ONLY THIS USER'S FILES
async function loadFiles() {
  gallery.innerHTML = `<div class="loader">Loading your files...</div>`;
  try {
    const res = await fetch(`${BACKEND_URL}/files/${userId}`);
    if(!res.ok) throw new Error("Backend not running");
    const files = await res.json();
    
    if(files.length === 0) {
      gallery.innerHTML = `<div class="loader">No files yet. Upload something!</div>`;
      return;
    }
    
    gallery.innerHTML = "";
    files.forEach(file => {
      const isVideo = file.type && file.type.startsWith('video');
      const mediaTag = isVideo 
        ? `<video src="${file.url}"></video>` 
        : `<img src="${file.url}" alt="${file.originalname}" loading="lazy" />`;
      
      gallery.innerHTML += `
        <div class="card" onclick="openViewer('${file.url}', '${file.type}')">
          ${mediaTag}
          <button class="delete-btn" onclick="event.stopPropagation(); openModal('${file._id}')">×</button>
          <div class="card-info">
            <p title="${file.originalname}">${file.originalname}</p>
            <small>${(file.size / 1024).toFixed(1)} KB</small>
          </div>
        </div>
      `;
    });
  } catch(err) {
    gallery.innerHTML = `<div class="loader"> Upload yor data</div>`;
    console.error("LOAD ERROR:", err);
  }
}

// 3. FULLSCREEN VIEWER
function openViewer(url, type) {
  const viewer = document.getElementById('viewerContent');
  if(type && type.startsWith('video')) {
    viewer.innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
  } else {
    viewer.innerHTML = `<img src="${url}" alt="fullscreen" />`;
  }
  document.getElementById('viewerModal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeViewer() {
  document.getElementById('viewerModal').style.display = 'none';
  document.getElementById('viewerContent').innerHTML = "";
  document.body.style.overflow = 'auto';
}
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeViewer(); });

// 4. UPLOAD FILES AS BASE64 - VERCEL SAFE
uploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const files = document.getElementById('fileInput').files;
  if(files.length === 0) return alert("Please choose files first");
  
  uploadStatus.innerText = "Uploading... 0/" + files.length;
  uploadStatus.style.color = "#38bdf8";
  
  let uploadedCount = 0;
  for(let file of files){
    const reader = new FileReader();
    reader.readAsDataURL(file);
    await new Promise(resolve => reader.onload = resolve);
    
    try {
      await fetch(`${BACKEND_URL}/upload`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          file: reader.result, // base64
          userId: userId,
          originalname: file.name,
          type: file.type,
          size: file.size
        })
      });
      uploadedCount++;
      uploadStatus.innerText = `Uploading... ${uploadedCount}/${files.length}`;
    } catch(err) {
      console.error("UPLOAD ERROR:", err);
    }
  }
  
  uploadStatus.innerText = `✅ ${uploadedCount} file(s) uploaded!`;
  uploadStatus.style.color = "#4ade80";
  document.getElementById('fileInput').value = "";
  loadFiles();
  setTimeout(() => uploadStatus.innerText = "", 4000);
});

// 5. DELETE ONE FILE
function openModal(id) {
  deleteId = id;
  document.getElementById('confirmModal').style.display = 'flex';
}
function closeModal() {
  document.getElementById('confirmModal').style.display = 'none';
  deleteId = null;
}
document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
  if(!deleteId) return;
  try {
    await fetch(`${BACKEND_URL}/delete/${deleteId}`, { method: 'DELETE' });
    closeModal();
    loadFiles();
  } catch(err) {
    alert("Delete failed");
    console.error(err);
  }
});

// 6. CLEAR ONLY THIS USER'S FILES
async function clearAll() {
  if(!confirm("Delete ALL your files? Others won't be affected.")) return;
  try {
    uploadStatus.innerText = "Clearing...";
    await fetch(`${BACKEND_URL}/clear/${userId}`, { method: 'DELETE' });
    uploadStatus.innerText = "✅ All your files cleared";
    loadFiles();
  } catch(err) {
    alert("Clear failed");
    console.error(err);
  }
  setTimeout(() => uploadStatus.innerText = "", 3000);
}

// RUN ON START
loadFiles();
</script>
</body>
</html>
