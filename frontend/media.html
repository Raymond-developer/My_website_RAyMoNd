<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Vault</title>
<style>
    * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial; background:#f1f1f1; padding:10px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; }
  h1 { font-size:22px; }
 .btn { padding:8px 14px; border:none; border-radius:8px; background:#007AFF; color:white; font-weight:600; cursor:pointer; }
 .btn.danger { background:#FF3B30; }

  /* RESPONSIVE GRID - 2 per row on phone, 4-6 on PC */
  #grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:12px; }
  @media(max-width:500px){ #grid { grid-template-columns: repeat(2, 1fr); } }

.card { background:white; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.1); }
.card img,.card video { width:100%; height:140px; object-fit:cover; cursor:pointer; background:#ddd; }
.card p { font-size:11px; padding:6px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.del { width:100%; background:#FF3B30; color:white; border:none; padding:8px; font-weight:bold; cursor:pointer; }

  /* FULLSCREEN VIEWER */
  #viewer { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:999; justify-content:center; align-items:center; flex-direction:column; }
  #viewer img, #viewer video { max-width:95%; max-height:85%; border-radius:8px; }
  #viewer.close { position:absolute; top:20px; right:30px; color:white; font-size:40px; cursor:pointer; font-weight:bold; }
  #viewer p { color:white; margin-top:10px; }
</style>
</head>
<body>

<header>
  <h1>Media Vault</h1>
  <div>
    <input type="file" id="fileInput" multiple accept="image/*,video/*">
    <button class="btn danger" onclick="clearAll()">Clear All</button>
  </div>
</header>

<div id="grid"></div>

<!-- FULLSCREEN POPUP -->
<div id="viewer">
  <span class="close" onclick="closeViewer()">&times;</span>
  <div id="viewerContent"></div>
  <p id="viewerName"></p>
</div>


<script>
const fileInput = document.getElementById('fileInput');
const grid = document.getElementById('grid');
const viewer = document.getElementById('viewer');
const viewerContent = document.getElementById('viewerContent');
const viewerName = document.getElementById('viewerName');

let mediaFiles = JSON.parse(localStorage.getItem('mediaVaultV2')) || [];
renderFiles();

// 1. SAVE WHEN YOU SELECT
fileInput.addEventListener('change', (e) => {
  [...e.target.files].forEach(file => {
    const reader = new FileReader();
    reader.onload = (event) => {
      mediaFiles.push({
        name: file.name,
        data: event.target.result,
        type: file.type
      });
      saveAndRender();
    }
    reader.readAsDataURL(file);
  });
  fileInput.value = '';
});

// 2. RENDER GRID
function renderFiles(){
  if(mediaFiles.length === 0){
    grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:gray; padding:40px;">No media yet. Choose files above</p>';
    return;
  }
  grid.innerHTML = '';
  mediaFiles.forEach((file, i) => {
    const isVideo = file.type.startsWith('video');
    grid.innerHTML += `
      <div class="card">
        ${isVideo 
       ? `<video src="${file.data}" onclick="openViewer(${i})"></video>` 
          : `<img src="${file.data}" onclick="openViewer(${i})" loading="lazy">`
        }
        <p title="${file.name}">${file.name}</p>
        <button class="del" onclick="deleteFile(${i})">Delete</button>
      </div>
    `;
  });
}

// 3. FULLSCREEN VIEWER
function openViewer(i){
  const file = mediaFiles[i];
  viewerName.innerText = file.name;
  const isVideo = file.type.startsWith('video');
  viewerContent.innerHTML = isVideo 
   ? `<video src="${file.data}" controls autoplay></video>`
    : `<img src="${file.data}">`;
  viewer.style.display = 'flex';
}
function closeViewer(){
  viewer.style.display = 'none';
  viewerContent.innerHTML = ''; // stop video
}

// 4. DELETE + SAVE
function deleteFile(i){
  if(confirm("Delete "+mediaFiles[i].name+"?")){
    mediaFiles.splice(i,1);
    saveAndRender();
  }
}
function clearAll(){
  if(confirm("Delete ALL files?")){
    mediaFiles = [];
    saveAndRender();
  }
}
function saveAndRender(){
  localStorage.setItem('mediaVaultV2', JSON.stringify(mediaFiles));
  renderFiles();
}

// close viewer on tap background
viewer.addEventListener('click', (e)=>{ if(e.target === viewer) closeViewer() })
</script>

</body>
</html>
