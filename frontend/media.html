<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Vault 50</title>
<style>
    * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family: Arial; background:#111; color:white; padding:10px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; gap:10px; flex-wrap:wrap; }
  h1 { font-size:20px; }
 .count { font-size:12px; color:#0A84FF; }
.btn { padding:8px 12px; border:none; border-radius:6px; background:#0A84FF; color:white; font-weight:bold; cursor:pointer; }
.btn.danger { background:#FF453A; }
  input[type=file] { color:white; }
  #grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:10px; }
  @media(max-width:600px){ #grid { grid-template-columns: repeat(2, 1fr); } }
.card { background:#1c1c1e; border-radius:10px; overflow:hidden; }
.thumb { width:100%; height:130px; background:#000; cursor:pointer; position:relative; }
.thumb img,.thumb video { width:100%; height:100%; object-fit:cover; }
.play { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:30px; color:white; opacity:0.7; }
.card p { font-size:10px; padding:5px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.del { width:100%; background:#FF453A; color:white; border:none; padding:7px; cursor:pointer; }
.loader { text-align:center; grid-column:1/-1; padding:40px; color:#aaa; }
  #viewer { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:999; justify-content:center; align-items:center; flex-direction:column; }
  #viewer img, #viewer video { max-width:100%; max-height:90%; }
  #viewer.close { position:absolute; top:15px; right:20px; font-size:40px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1>Media Vault <span class="count" id="count">0/50</span></h1>
  <div>
    <input type="file" id="fileInput" multiple accept="image/*,video/*">
    <button class="btn danger" onclick="clearAll()">Clear All</button>
  </div>
</header>

<div id="grid"><div class="loader">No media yet</div></div>

<div id="viewer">
  <span class="close" onclick="closeViewer()">&times;</span>
  <div id="viewerContent"></div>
</div>

<script>
const MAX_FILES = 50; // CHANGE THIS IF YOU WANT
const fileInput = document.getElementById('fileInput');
const grid = document.getElementById('grid');
const viewer = document.getElementById('viewer');
const viewerContent = document.getElementById('viewerContent');
const count = document.getElementById('count');

let mediaFiles = JSON.parse(localStorage.getItem('vaultFiles50')) || [];
renderFiles();

// SAVE WHEN YOU SELECT
fileInput.addEventListener('change', () => {
  if(mediaFiles.length >= MAX_FILES){
    alert(`Limit reached! You can only save ${MAX_FILES} files. Delete some first.`);
    return;
  }

  [...fileInput.files].forEach(file => {
    if(mediaFiles.length >= MAX_FILES){
      alert(`Stopped. ${MAX_FILES} file limit reached.`);
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      // COMPRESS IMAGES to save space
      if(file.type.startsWith('image')){
        compressImage(e.target.result, (compressed) => {
          addFile(file.name, compressed, file.type);
        });
      } else {
        addFile(file.name, e.target.result, file.type); // videos not compressed
      }
    }
    reader.readAsDataURL(file);
  });
  fileInput.value = '';
});

function addFile(name, data, type){
  mediaFiles.push({ name, data, type });
  saveAndRender();
}

// COMPRESS IMAGE TO FIT MORE
function compressImage(base64, callback){
  const img = new Image();
  img.src = base64;
  img.onload = () => {
    const canvas = document.createElement('canvas');
    const maxW = 1000; // resize to 1000px wide max
    const scale = maxW / img.width;
    canvas.width = maxW;
    canvas.height = img.height * scale;
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    callback(canvas.toDataURL('image/jpeg', 0.7)); // 70% quality
  }
}

// SHOW GRID
function renderFiles(){
  count.innerText = `${mediaFiles.length}/${MAX_FILES}`;
  if(mediaFiles.length === 0){
    grid.innerHTML = '<div class="loader">Tap "Choose Files" to add up to 50 photos/videos</div>';
    return;
  }
  grid.innerHTML = '';
  mediaFiles.forEach((file, i) => {
    const isVideo = file.type.startsWith('video');
    grid.innerHTML += `
      <div class="card">
        <div class="thumb" onclick="openViewer(${i})">
          ${isVideo
        ? `<video src="${file.data}" muted></video><div class="play">▶</div>`
            : `<img src="${file.data}" loading="lazy">`
          }
        </div>
        <p>${file.name}</p>
        <button class="del" onclick="deleteFile(${i})">Delete</button>
      </div>
    `;
  });
}

// FULLSCREEN
function openViewer(i){
  const file = mediaFiles[i];
  const isVideo = file.type.startsWith('video');
  viewerContent.innerHTML = isVideo
? `<video src="${file.data}" controls autoplay></video>`
    : `<img src="${file.data}">`;
  viewer.style.display = 'flex';
}
function closeViewer(){ viewer.style.display = 'none'; viewerContent.innerHTML = ''; }
viewer.onclick = (e) => { if(e.target === viewer) closeViewer() }

// DELETE WITH CONFIRMATION
function deleteFile(i){
  if(confirm(`Delete "${mediaFiles[i].name}"?`)){
    mediaFiles.splice(i,1);
    saveAndRender();
  }
}
function clearAll(){
  if(confirm(`Delete ALL ${mediaFiles.length} files?`)){
    mediaFiles = [];
    saveAndRender();
  }
}
function saveAndRender(){
  try{
    localStorage.setItem('vaultFiles50', JSON.stringify(mediaFiles));
  }catch(e){
    alert("Storage Full! iPhone only gives 5MB. Delete some files or use smaller videos.");
    mediaFiles.pop(); // remove the last one that failed
  }
  renderFiles();
}
</script>
</body>
</html>
