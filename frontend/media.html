<!DOCTYPE html>
<html lang="en">
<head>
      <script>
  const token = localStorage.getItem('token');

    if (!token) {
      // Not logged in? Kick out immediately
      window.location.replace('/login.html');
    }
   </script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Vault GB</title>
<style>
    * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family: Arial; background:#111; color:white; padding:10px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; gap:10px; flex-wrap:wrap; }
  h1 { font-size:20px; }
 .count { font-size:12px; color:#0A84FF; }
.btn { padding:8px 12px; border:none; border-radius:6px; background:#0A84FF; color:white; font-weight:bold; cursor:pointer; }
.btn.danger { background:#FF453A; }
  input[type=file] { color:white; }
  #grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:10px; }
  @media(max-width:600px){ #grid { grid-template-columns: repeat(2, 1fr); } }
.card { background:#1c1c1e; border-radius:10px; overflow:hidden; }
.thumb { width:100%; height:130px; background:#000; cursor:pointer; position:relative; }
.thumb img,.thumb video { width:100%; height:100%; object-fit:cover; }
.play { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:30px; color:white; opacity:0.7; }
.card p { font-size:10px; padding:5px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.del { width:100%; background:#FF453A; color:white; border:none; padding:7px; cursor:pointer; }
.loader { text-align:center; grid-column:1/-1; padding:40px; color:#aaa; }
  #viewer { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:999; justify-content:center; align-items:center; flex-direction:column; }
  #viewer img, #viewer video { max-width:100%; max-height:90%; }
  #viewer.close { position:absolute; top:15px; right:20px; font-size:40px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1>Media Vault <span class="count" id="count">0/50</span></h1>
  <div>
    <input type="file" id="fileInput" multiple accept="image/*,video/*">
    <button class="btn danger" onclick="clearAll()">Clear All</button>
  </div>
</header>

<div id="grid"><div class="loader">Opening Database...</div></div>

<div id="viewer">
  <span class="close" onclick="closeViewer()">&times;</span>
  <div id="viewerContent"></div>
</div>

<script>
const MAX_FILES = 100;
const DB_NAME = "MediaVaultDB";
const STORE_NAME = "files";
let db;

const fileInput = document.getElementById('fileInput');
const grid = document.getElementById('grid');
const viewer = document.getElementById('viewer');
const viewerContent = document.getElementById('viewerContent');
const count = document.getElementById('count');

// 1. OPEN DATABASE
const request = indexedDB.open(DB_NAME, 1);
request.onerror = () => alert("Database failed to open");
request.onsuccess = (e) => { db = e.target.result; renderFiles(); }
request.onupgradeneeded = (e) => {
  db = e.target.result;
  db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
}

// 2. ADD FILE
fileInput.addEventListener('change', async () => {
  const files = [...fileInput.files];
  const tx = db.transaction(STORE_NAME, "readonly");
  const store = tx.objectStore(STORE_NAME);
  const countReq = store.count();
  
  countReq.onsuccess = async () => {
    if(countReq.result + files.length > MAX_FILES){
      alert(`Limit reached! Max ${MAX_FILES} files.`);
      return;
    }
    for(let file of files){
      await addFile(file);
    }
    renderFiles();
  }
  fileInput.value = '';
});

function addFile(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      const store = tx.objectStore(STORE_NAME);
      store.add({ name: file.name, data: e.target.result, type: file.type });
      tx.oncomplete = resolve;
    }
    reader.readAsDataURL(file);
  });
}

// 3. RENDER FILES
function renderFiles(){
  const tx = db.transaction(STORE_NAME, "readonly");
  const store = tx.objectStore(STORE_NAME);
  const req = store.getAll();
  req.onsuccess = () => {
    const mediaFiles = req.result;
    count.innerText = `${mediaFiles.length}/${MAX_FILES}`;
    if(mediaFiles.length === 0){
      grid.innerHTML = '<div class="loader">Tap "Choose Files" to add up to 50 photos/videos</div>';
      return;
    }
    grid.innerHTML = '';
    mediaFiles.forEach((file) => {
      const isVideo = file.type.startsWith('video');
      grid.innerHTML += `
        <div class="card">
          <div class="thumb" onclick="openViewer(${file.id})">
            ${isVideo 
           ? `<video src="${file.data}" muted></video><div class="play">▶</div>` 
              : `<img src="${file.data}" loading="lazy">`
            }
          </div>
          <p>${file.name}</p>
          <button class="del" onclick="deleteFile(${file.id})">Delete</button>
        </div>
      `;
    });
  }
}

// 4. FULLSCREEN
function openViewer(id){
  const tx = db.transaction(STORE_NAME, "readonly");
  const store = tx.objectStore(STORE_NAME);
  store.get(id).onsuccess = (e) => {
    const file = e.target.result;
    const isVideo = file.type.startsWith('video');
    viewerContent.innerHTML = isVideo
   ? `<video src="${file.data}" controls autoplay></video>`
      : `<img src="${file.data}">`;
    viewer.style.display = 'flex';
  }
}
function closeViewer(){ viewer.style.display = 'none'; viewerContent.innerHTML = ''; }
viewer.onclick = (e) => { if(e.target === viewer) closeViewer() }

// 5. DELETE
function deleteFile(id){
  if(confirm("Delete this file?")){
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = renderFiles;
  }
}
function clearAll(){
  if(confirm("Delete ALL files?")){
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = renderFiles;
  }
}
</script>
</body>
</html>
