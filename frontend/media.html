<!DOCTYPE html>
<html lang="en">
<head>

    <script>
     const token = localStorage.getItem('token');

    if (!token) {
      // Not logged in? Kick out immediately
      window.location.replace('/login.html');
    }
   </script> 

    <title>Media Vault</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #000;
            --card: #111;
            --card2: #1a1a1a;
            --text: #fff;
            --muted: #aaa;
            --danger: #ff3b30;
        }
        * { box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            padding: 15px; 
            margin: 0; 
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        h2 { 
            font-size: clamp(22px, 5vw, 32px); 
            font-weight: 800; 
            margin: 0; 
        }
        .counter { color: var(--muted); font-weight: 400; font-size: clamp(14px, 3vw, 18px); }

       .controls { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        input[type="file"] { 
            flex: 1 1 200px; 
            color: white; 
            background: var(--card);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
        }
       .clear-btn { 
            background: var(--danger); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer;
            flex-shrink: 0;
        }
        .clear-btn:active { opacity: 0.8; }

       .grid { 
            display: grid; 
            gap: 10px; 
            /* Mobile: 2 cols */
            grid-template-columns: repeat(2, 1fr);
        }
        /* Tablet: 3-4 cols */
        @media (min-width: 640px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(4, 1fr); }
        }
        /* Laptop/Desktop: auto fill min 220px */
        @media (min-width: 1024px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        }

       .item { 
            background: var(--card); 
            border-radius: 12px; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
       .item img,.item video { 
            width: 100%; 
            aspect-ratio: 1/1; 
            object-fit: cover; 
            cursor: pointer; 
            background: #000;
        }
       .filename { 
            font-size: 12px; 
            text-align: center; 
            padding: 8px; 
            background: var(--card2); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
       .delete-btn { 
            background: var(--danger); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 10px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: auto;
        }
        .delete-btn:active { opacity: 0.8; }

       .modal { 
            display: none; 
            position: fixed; 
            z-index: 999; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.95); 
            justify-content: center; 
            align-items: center;
            padding: 10px;
        }
       .modal.active { display: flex; }
       .modal-content img,.modal-content video { 
            max-width: 95vw; 
            max-height: 90vh;
            border-radius: 8px;
        }
       .close { 
            position: absolute; 
            top: 15px; 
            right: 20px; 
            color: #fff; 
            font-size: 35px; 
            cursor: pointer; 
        }
       .video-wrapper { position: relative; }
       .fs-btn { 
            position: absolute; 
            bottom: 10px; 
            right: 10px; 
            background: rgba(0,0,0,0.7); 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 6px; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h2>Media Vault <span class="counter" id="counter">0/100</span></h2>
    </header>
    
    <div class="controls">
        <input type="file" id="fileInput" accept="image/*,video/*" multiple>
        <button class="clear-btn" onclick="clearAll()">Clear All</button>
    </div>

    <div class="grid" id="gallery"></div>

    <div id="modal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <div class="modal-content" id="modalContent"></div>
    </div>

<script>
const API_URL = 'https://my-website-r-ay-mo-nd.vercel.app'; // Change to your Render/Railway URL when deploying

async function loadFiles() {
    try {
        const res = await fetch(`${API_URL}/files`);
        const files = await res.json();
        document.getElementById('counter').textContent = `${files.length}/100`;

        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';

        files.forEach(item => {
            const url = `${API_URL}/uploads/${item.filename}`;
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                ${item.type.startsWith('image')
                   ? `<img src="${url}" loading="lazy" onclick="openModal('${url}', 'image')">`
                    : `<video src="${url}" loading="lazy" muted onclick="openModal('${url}', 'video')"></video>`
                }
                <div class="filename" title="${item.originalname}">${item.originalname}</div>
                <button class="delete-btn" onclick="deleteFile('${item._id}')">Delete</button>
            `;
            gallery.appendChild(div);
        });
    } catch (e) {
        console.log("Failed to load files", e)
    }
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
    const formData = new FormData();
    for (let file of e.target.files) formData.append('files', file);

    await fetch(`${API_URL}/upload`, { method: 'POST', body: formData });
    e.target.value = '';
    loadFiles();
});

async function deleteFile(id) {
    if (confirm('Delete this file?')) {
        await fetch(`${API_URL}/delete/${id}`, { method: 'DELETE' });
        loadFiles();
    }
}

async function clearAll() {
    if (confirm('Delete ALL files?')) {
        await fetch(`${API_URL}/clear`, { method: 'DELETE' });
        loadFiles();
    }
}

function openModal(url, type) {
    const modal = document.getElementById('modal');
    const content = document.getElementById('modalContent');
    content.innerHTML = type === 'image'
       ? `<img src="${url}">`
        : `<div class="video-wrapper"><video id="modalVideo" src="${url}" controls autoplay playsinline></video><button class="fs-btn" onclick="event.stopPropagation(); toggleFullscreen()">⛶</button></div>`;
    modal.classList.add('active');
}
function toggleFullscreen() { document.getElementById('modalVideo').requestFullscreen?.(); }
function closeModal() { 
    document.exitFullscreen?.(); 
    document.getElementById('modal').classList.remove('active'); 
    document.getElementById('modalContent').innerHTML = ''; 
}

loadFiles();
</script>
</body>
</html>
