<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissors</title>
  <style>
    body { font-family: Arial; text-align: center; background: #1e1e2e; color: white; padding: 50px; }
    button { font-size: 20px; padding: 15px 30px; margin: 10px; border: none; border-radius: 10px; cursor: pointer; }
    #result { font-size: 24px; margin-top: 20px; }
    .con{
      display: grid;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="con">

  <h1>Rock Paper Scissors ✊✋✌️</h1>
  <button onclick="play('rock')">✊ Rock</button>
  <button onclick="play('paper')">✋ Paper</button>
  <button onclick="play('scissors')">✌️ Scissors</button>
  
  <div id="result"></div>
  <div id="score"></div>

  </div>
  <script>
    let userScore = 0;
    let compScore = 0;

    function play(userChoice) {
      const choices = ['rock', 'paper', 'scissors'];
      const compChoice = choices[Math.floor(Math.random() * 3)];
      
      let result = '';
      if (userChoice === compChoice) {
        result = "It's a Tie!";
      } else if (
        (userChoice === 'rock' && compChoice === 'scissors') ||
        (userChoice === 'paper' && compChoice === 'rock') ||
        (userChoice === 'scissors' && compChoice === 'paper')
      ) {
        result = 'You Win! 🎉';
        userScore++;
      } else {
        result = 'You Lose! 😢';
        compScore++;
      }

      document.getElementById('result').innerHTML = 
        `You: ${userChoice} | Computer: ${compChoice} <br><b>${result}</b>`;
      document.getElementById('score').innerHTML = 
        `Score - You: ${userScore} | Computer: ${compScore}`;
    }
  </script>
</body>
</html>
