<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>
<style>
* { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  text-align: center;
  padding: 20px;
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 { margin-bottom: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

#scoreBoard {
  display: flex;
  gap: 15px;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 20px;
  background: rgba(255,255,255,0.15);
  padding: 12px 25px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
}
#scoreBoard span { color: #ffd700; font-size: 22px; }

#resultText {
  font-size: 28px;
  font-weight: bold;
  margin: 15px 0;
  min-height: 40px;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

#resultArea {
  display: flex;
  gap: 40px;
  justify-content: center;
  align-items: center;
  margin: 20px 0;
  flex-wrap: wrap;
}
.playerBox { text-align: center; }
.playerBox h3 { margin: 5px 0; }

.displayBox {
  width: 140px;
  height: 140px;
  background: rgba(255,255,255,0.2);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  border: 3px solid rgba(255,255,255,0.3);
  transition: transform 0.3s;
}
.displayBox.animate { animation: pop 0.3s; }
@keyframes pop { 0%{transform:scale(0.8)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

#choices {
  display: flex;
  gap: 20px;
  margin: 20px 0;
  flex-wrap: wrap;
  justify-content: center;
}
.choiceBtn {
  background: rgba(255,255,255,0.2);
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  padding: 15px;
  cursor: pointer;
  transition: all 0.2s;
  width: 120px;
  backdrop-filter: blur(10px);
}
.choiceBtn:hover { transform: translateY(-5px); background: rgba(255,255,255,0.3); border-color: #ffd700; }
.choiceBtn.icon { font-size: 60px; display: block; margin-bottom: 5px; }
.choiceBtn p { margin: 0; font-weight: bold; font-size: 14px; }

#resetBtn {
  background: #ff4757;
  color: #fff;
  border: none;
  padding: 14px 30px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 10px;
  transition: all 0.2s;
}
#resetBtn:hover { background: #ff6b7a; transform: scale(1.05); }

@media (max-width: 500px) {
.displayBox { width: 100px; height: 100px; font-size: 55px; }
.choiceBtn { width: 95px; }
.choiceBtn.icon { font-size: 45px; }
 #resultArea { gap: 20px; }
}
</style>
</head>
<body>

<h1>✊ ROCK PAPER SCISSORS ✌️</h1>

<div id="scoreBoard">
  <div>YOU: <span id="playerScore">0</span></div>
  <div>COM: <span id="computerScore">0</span></div>
  <div>DRAWS: <span id="draws">0</span></div>
</div>

<div id="resultText">Pick one to start!</div>

<div id="resultArea">
  <div class="playerBox">
    <h3>YOU</h3>
    <div id="playerDisplay" class="displayBox">❓</div>
  </div>
  <div class="playerBox">
    <h3>COMPUTER</h3>
    <div id="computerDisplay" class="displayBox">❓</div>
  </div>
</div>

<div id="choices">
  <div class="choiceBtn" onclick="play('rock')">
    <span class="icon">✊</span>
    <p>ROCK</p>
  </div>
  <div class="choiceBtn" onclick="play('paper')">
    <span class="icon">✋</span>
    <p>PAPER</p>
  </div>
  <div class="choiceBtn" onclick="play('scissors')">
    <span class="icon">✌️</span>
    <p>SCISSORS</p>
  </div>
</div>

<button id="resetBtn" onclick="resetScore()">RESET SCORE</button>

<script>
let playerScore = 0;
let computerScore = 0;
let draws = 0;

const icons = {
  rock: "✊",
  paper: "✋",
  scissors: "✌️",
  none: "❓"
};

const choices = ['rock', 'paper', 'scissors'];
function play(playerChoice) {
  let computerChoice = choices[Math.floor(Math.random() * 3)];
  
  // Show images with animation
  const playerBox = document.getElementById('playerDisplay');
  const computerBox = document.getElementById('computerDisplay');
  
  playerBox.innerText = icons[playerChoice];
  computerBox.innerText = icons[computerChoice];
  
  playerBox.classList.add('animate');
  computerBox.classList.add('animate');
  setTimeout(() => {
    playerBox.classList.remove('animate');
    computerBox.classList.remove('animate');
  }, 300);
  
  let result = '';
  
  if(playerChoice === computerChoice) {
    result = "IT'S A DRAW! 🤝";
    draws++;
  } else if(
    (playerChoice === 'rock' && computerChoice === 'scissors') ||
    (playerChoice === 'paper' && computerChoice === 'rock') ||
    (playerChoice === 'scissors' && computerChoice === 'paper')
  ) {
    result = "YOU WIN! 🎉";
    playerScore++;
  } else {
    result = "YOU LOSE! 😢";
    computerScore++;
  }
  
  document.getElementById('resultText').innerText = result;
  updateScore();
}

function updateScore() {
  document.getElementById('playerScore').innerText = playerScore;
  document.getElementById('computerScore').innerText = computerScore;
  document.getElementById('draws').innerText = draws;
}

function resetScore() {
  playerScore = 0;
  computerScore = 0;
  draws = 0;
  updateScore();
  document.getElementById('resultText').innerText = "Pick one to start!";
  document.getElementById('playerDisplay').innerText = icons.none;
  document.getElementById('computerDisplay').innerText = icons.none;
}

// Keyboard support: R, P, S
document.addEventListener('keydown', e => {
  if(e.key.toLowerCase() === 'r') play('rock');
  if(e.key.toLowerCase() === 'p') play('paper');
  if(e.key.toLowerCase() === 's') play('scissors');
});
</script>

</body>
</html>
